<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="mbGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#065F46"/>
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="#0A0E17"/>
  <rect x="3" y="3" width="506" height="506" rx="109" stroke="#1E293B" stroke-width="6"/>

  <!-- Glowing MB Monogram Cube -->
  <g transform="translate(106, 80)">
    <!-- 3D Cube Isometric Grid -->
    <path d="M150 20 L270 90 L150 160 L30 90 Z" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="8" stroke-linejoin="round"/>
    <path d="M30 90 L150 160 L150 300 L30 230 Z" fill="#047857" fill-opacity="0.4" stroke="#10B981" stroke-width="8" stroke-linejoin="round"/>
    <path d="M270 90 L150 160 L150 300 L270 230 Z" fill="#064E3B" fill-opacity="0.6" stroke="#10B981" stroke-width="8" stroke-linejoin="round"/>

    <!-- Bold MB Core -->
    <text x="50" y="225" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Outfit', sans-serif" font-size="130" font-weight="900" fill="#FFFFFF" letter-spacing="-4" filter="url(#neon)">MB</text>
  </g>

  <!-- Wordmark -->
  <text x="256" y="440" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Outfit', sans-serif" font-size="52" font-weight="800" fill="#FFFFFF" letter-spacing="-1.5">
    <tspan fill="#10B981">Mini</tspan>Base
  </text>
</svg>