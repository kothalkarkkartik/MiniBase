<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MiniBase — User Auth & Registration Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #090D16;
      --card-bg: rgba(17, 24, 39, 0.75);
      --border: rgba(255, 255, 255, 0.08);
      --primary: #10B981;
      --primary-hover: #059669;
      --text: #F3F4F6;
      --text-muted: #9CA3AF;
      --error: #EF4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow-x: hidden;
    }
    .glow {
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.15) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 0;
    }
    .card {
      position: relative;
      z-index: 10;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 100%;
      max-width: 440px;
      padding: 32px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .header { text-align: center; margin-bottom: 24px; }
    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(16, 185, 129, 0.15);
      color: var(--primary);
      margin-bottom: 12px;
    }
    h1 { font-size: 22px; font-weight: 800; margin-bottom: 6px; }
    p.sub { font-size: 13px; color: var(--text-muted); }
    .tabs {
      display: flex;
      background: rgba(255, 255, 255, 0.05);
      padding: 4px;
      border-radius: 10px;
      margin-bottom: 20px;
    }
    .tab {
      flex: 1;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 600;
      border: none;
      border-radius: 7px;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .tab.active { background: var(--primary); color: #fff; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }
    input {
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s ease;
    }
    input:focus { border-color: var(--primary); background: rgba(255, 255, 255, 0.07); }
    .btn {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s ease;
      margin-top: 8px;
    }
    .btn:hover { background: var(--primary-hover); }
    .status {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      font-size: 12px;
      display: none;
      word-break: break-all;
      font-family: 'JetBrains Mono', monospace;
    }
    .status.success { display: block; background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.3); color: #34D399; }
    .status.error { display: block; background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); color: #F87171; }
    .footer-links { text-align: center; margin-top: 20px; font-size: 12px; color: var(--text-muted); }
    .footer-links a { color: #38BDF8; text-decoration: none; margin: 0 6px; }
    .footer-links a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="glow"></div>
  <div class="card">
    <div class="header">
      <div class="badge">App User Portal</div>
      <h1>MiniBase User Authentication</h1>
      <p class="sub">Register and authenticate end-users for your apps</p>
    </div>

    <div class="tabs">
      <button class="tab active" id="tab-register" onclick="switchTab('register')">Register (Sign Up)</button>
      <button class="tab" id="tab-login" onclick="switchTab('login')">Sign In (Login)</button>
    </div>

    <!-- Register Form -->
    <form id="form-register" onsubmit="handleRegister(event)">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="reg-name" placeholder="John Doe" required />
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="reg-email" placeholder="user@gmail.com" required />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="reg-password" placeholder="At least 8 characters" minlength="8" required />
      </div>
      <button type="submit" class="btn" id="reg-btn">Create User Account</button>
    </form>

    <!-- Login Form -->
    <form id="form-login" style="display:none;" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="login-email" placeholder="user@gmail.com" required />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="login-password" placeholder="Your password" required />
      </div>
      <button type="submit" class="btn" id="login-btn">Sign In</button>
    </form>

    <div id="status-box" class="status"></div>

    <div class="footer-links">
      <a href="/_/">← Back to Admin Studio</a> •
      <a href="/api/collections/users/records" target="_blank">View Users API</a>
    </div>
  </div>

  <script>
    function switchTab(type) {
      document.getElementById('tab-register').classList.toggle('active', type === 'register');
      document.getElementById('tab-login').classList.toggle('active', type === 'login');
      document.getElementById('form-register').style.display = type === 'register' ? 'block' : 'none';
      document.getElementById('form-login').style.display = type === 'login' ? 'block' : 'none';
      hideStatus();
    }

    function showStatus(msg, type) {
      const box = document.getElementById('status-box');
      box.className = 'status ' + type;
      box.innerHTML = msg;
    }

    function hideStatus() {
      const box = document.getElementById('status-box');
      box.style.display = 'none';
    }

    async function handleRegister(e) {
      e.preventDefault();
      const name = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value;

      try {
        const res = await fetch('/api/collections/users/records', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'Registration failed');

        showStatus(`✔ User registered successfully!<br>ID: ${data.id}<br>Email: ${data.email}<br><span style="color:#38BDF8; cursor:pointer;" onclick="switchTab('login')">Click here to Sign In</span>`, 'success');
        document.getElementById('login-email').value = email;
      } catch (err) {
        showStatus('✖ ' + err.message, 'error');
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;

      try {
        const res = await fetch('/api/collections/users/auth-with-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identity: email, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'Login failed');

        showStatus(`✔ Logged in successfully!<br>User: ${data.record.name || data.record.email}<br>JWT Token: ${data.token.substring(0, 32)}...`, 'success');
      } catch (err) {
        showStatus('✖ ' + err.message, 'error');
      }
    }
  </script>
</body>
</html>
